<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteHub | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Login-only layout and theme styles. -->
    <style>
      :root {
        --bg: #1a120d;
        --panel: rgba(33, 24, 20, 0.92);
        --panel-alt: rgba(47, 34, 28, 0.94);
        --card: #fffaf3;
        --text: #fef7ee;
        --muted: #d8c7b7;
        --primary: #f4b860;
        --primary-dark: #d88b2d;
        --success: #52d29d;
        --danger: #f56c6c;
        --line: rgba(244, 184, 96, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Inter', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(244, 184, 96, 0.18), transparent 25%),
          linear-gradient(135deg, #120d0b 0%, #1d1512 40%, #2a1d18 100%);
        color: var(--text);
      }

      .login-shell {
        width: min(420px, calc(100% - 32px));
        background: linear-gradient(180deg, rgba(44, 31, 25, 0.96), rgba(24, 18, 15, 0.96));
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 28px 48px rgba(15, 10, 8, 0.5);
        padding: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #2b1209;
        background: linear-gradient(135deg, var(--primary), #f9744d);
        box-shadow: 0 12px 24px rgba(244, 184, 96, 0.25);
      }

      h1 {
        margin: 0;
        font-size: 1.8rem;
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      .primary-button {
        border: none;
        border-radius: 12px;
        padding: 13px 18px;
        font-weight: 800;
        color: #2b1209;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        cursor: pointer;
        box-shadow: 0 14px 24px rgba(244, 184, 96, 0.24);
      }

      .helper-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .error-box,
      .success-box {
        display: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.92rem;
      }

      .error-box {
        background: rgba(245, 108, 108, 0.12);
        border: 1px solid rgba(245, 108, 108, 0.22);
        color: #fecaca;
      }

      .success-box {
        background: rgba(82, 210, 157, 0.12);
        border: 1px solid rgba(82, 210, 157, 0.24);
        color: #d1fae5;
      }

      .demo-credentials {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <!-- Credentials form and demo account for local use. -->
    <div class="login-shell">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <p class="eyebrow" style="margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;font-size:12px;">Restaurant</p>
          <h1>BiteHub</h1>
        </div>
      </div>

      <p class="subtitle">Login to access the management dashboard.</p>

      <div id="errorBox" class="error-box" role="alert"></div>
      <div id="successBox" class="success-box" role="status"></div>

      <form id="loginForm">
        <label>
          Username
          <input id="username" name="username" type="text" placeholder="admin" required />
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </label>

        <div class="helper-row">
          <span>Secure access</span>
          <a href="#" style="color: var(--primary); text-decoration: none;">Need help?</a>
        </div>

        <button type="submit" class="primary-button">Login</button>
      </form>

      <div class="demo-credentials">
        Demo account: <strong>admin</strong> / <strong>admin123</strong>
      </div>
    </div>

    <!-- Authenticate through the Flask API and show its response. -->
    <script>
      const form = document.getElementById('loginForm');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');

      function setMessage(box, text) {
        box.textContent = text;
        box.style.display = 'block';
      }

      async function parseResponse(response) {
        const text = await response.text();
        if (!text) return {};

        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error(text || `Request failed with status ${response.status}.`);
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await parseResponse(response);
          if (!response.ok) {
            throw new Error(data.error || data.message || 'Login failed.');
          }

          setMessage(successBox, data.message || 'Login successful. Redirecting...');
          window.location.href = '/';
        } catch (error) {
          setMessage(errorBox, error.message || 'Unable to login.');
        }
      });
    </script>
  </body>
</html>
